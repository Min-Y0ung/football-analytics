[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stfootball"
version = "0.1.0"
description = "Spatio-temporal GNN trajectory prediction and space creation value for football tracking data"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
